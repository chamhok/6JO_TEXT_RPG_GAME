name: Deploy v0.4.1

on:
  push:
    paths:
      - .github/workflows/deploy-v041.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild self-contained game
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')
          ref = '7e26a33ed5e36f138c60f492a90662caaf0b156a'
          encoded = []
          for i in range(6):
              text = subprocess.check_output(
                  ['git', 'show', f'{ref}:chunks/c{i}.js'],
                  text=True,
              )
              match = re.search(r"push\('([^']+)'\)", text)
              if not match:
                  raise SystemExit(f'chunk {i} parse failed')
              encoded.append(match.group(1))

          old = gzip.decompress(base64.b64decode(''.join(encoded)))
          pathlib.Path('/tmp/old.html').write_bytes(old)

          patch_b64 = ''.join(
              (root / f'patches/v041.{i}.b64').read_text().strip()
              for i in range(5)
          )
          pathlib.Path('/tmp/v041.patch').write_bytes(base64.b64decode(patch_b64))
          PY

          patch /tmp/old.html < /tmp/v041.patch
          cp /tmp/old.html index.html
          printf 'v0.4.1\n' > VERSION.txt

          python - <<'PY'
          import hashlib
          import pathlib

          path = pathlib.Path('index.html')
          got = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = '79f140bb35f66afdb38d0977918f6011879a8f059a5b314a08a634645a088250'
          if got != expected:
              raise SystemExit(f'SHA-256 mismatch: {got}')
          print('verified', got)
          PY

      - name: Publish v0.4.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION.txt
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m 'Deploy v0.4.1 compatibility and skill recognition fix'
          git push
